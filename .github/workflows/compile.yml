name: CI-compile

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2max/dev:v20260228
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Compile checked-in EENET experiment
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Preserve authoritative C files while materializing unchanged legacy integration.
          # No new generator stage: the checked-in files are restored and verified before make.
          direct_source=$(mktemp -d)
          cp iop/smap_eenet/src/main.c iop/smap_eenet/src/adapter.c iop/smap_eenet/src/adapter.h "$direct_source/"
          rm iop/smap_eenet/src/main.c iop/smap_eenet/src/adapter.c iop/smap_eenet/src/adapter.h
          python3 pc/prepare_eent_candidate.py
          python3 pc/eent_candidate.py --check
          python3 pc/eent_candidate.py --apply
          python3 pc/diagnose_eent_candidate.py --check
          python3 pc/diagnose_eent_candidate.py
          python3 pc/runtime_eent_rpc.py --check
          python3 pc/runtime_eent_rpc.py
          python3 pc/trace_eenet_config.py --check
          python3 pc/trace_eenet_config.py
          python3 pc/fix_eenet_control.py --check
          python3 pc/fix_eenet_control.py
          python3 pc/trace_eent_ee.py --check
          python3 pc/trace_eent_ee.py
          cp "$direct_source/main.c" iop/smap_eenet/src/main.c
          cp "$direct_source/adapter.c" iop/smap_eenet/src/adapter.c
          cp "$direct_source/adapter.h" iop/smap_eenet/src/adapter.h
          cmp "$direct_source/main.c" iop/smap_eenet/src/main.c
          cmp "$direct_source/adapter.c" iop/smap_eenet/src/adapter.c
          cmp "$direct_source/adapter.h" iop/smap_eenet/src/adapter.h
          sha256sum iop/smap_eenet/src/main.c iop/smap_eenet/src/adapter.c iop/smap_eenet/src/adapter.h
          rm -rf "$direct_source"
          make clean all release
          python3 pc/trace_eent_ee.py --verify-build
          test -s iop/smap_eenet/irx/smap_eenet.irx
          test -s ee/loader/modules/smap_eenet.irx

      - name: Upload release as artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          path: |
            releases/*.7z

      - name: Create latest release
        if: github.ref == 'refs/heads/master'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: "Latest development build"
          files: |
            releases/*.7z
