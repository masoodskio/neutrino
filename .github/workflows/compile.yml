name: CI-compile

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2max/dev:v20260228
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Compile experimental EENET candidate
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 pc/prepare_eent_candidate.py
          python3 pc/eent_candidate.py --check
          python3 pc/eent_candidate.py --apply
          make clean all release
          test -s iop/smap_eenet/irx/smap_eenet.irx
          test -s ee/loader/modules/smap_eenet.irx

      - name: Upload release as artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          path: |
            releases/*.7z

      - name: Create latest release
        if: github.ref == 'refs/heads/master'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: "Latest development build"
          files: |
            releases/*.7z
